services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: notes_user
      POSTGRES_PASSWORD: notes_pass
    volumes:
      - notes-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes_user -d notesdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: sticky-notes-backend:1.0
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: notesdb
      DB_USER: notes_user
      DB_PASSWORD: notes_pass
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: sticky-notes-frontend:1.0
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  notes-data:
